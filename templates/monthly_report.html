<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='monthly_report.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="hide-on-print">Monthly Attendance Report</h2>

        <div class="hide-on-print">
            <label for="year">Select Year:</label>
            <select id="year"></select>

            <label for="month">Select Month:</label>
            <select id="month"></select>

            <label for="bus">Select Bus Number:</label>
            <select id="bus">
                <option value="all">All Buses</option>
            </select>

            <div class="button-container">
                <button onclick="fetchAttendance()">Get Report</button>
                <button onclick="printReport()">Print</button>
            </div>
        </div>

        <div class="show-on-print" id="printHeader">
            <h2>Monthly Attendance Report</h2>
            <p><strong>Year:</strong> <span id="printYear"></span> | <strong>Month:</strong> <span id="printMonth"></span> | <strong>Bus Number:</strong> <span id="printBus"></span></p>
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Enrollment ID</th>
                        <th>Name</th>
                        <th>Bus No.</th>
                        <th>Morning Status</th>
                        <th>Morning Time</th>
                        <th>Evening Status</th>
                        <th>Evening Time</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="{{ url_for('static', path='monthly_report.js') }}"></script>
</body>
</html>
