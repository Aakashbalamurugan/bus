<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Attendance Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', path='admin2.css') }}">
</head>
<body>

    <h2>Attendance Reports</h2>

    <!-- Date Range Selection -->
    <div>
        <label for="start-date">Start Date:</label>
        <input type="date" id="start-date" required>
    
        <label for="end-date">End Date:</label>
        <input type="date" id="end-date" required>
    </div>

    <button onclick="fetchReport()">Get Report</button>

    <!-- Student Report Search -->
    <h3>Search Student Attendance</h3>
    <label for="student-id">Enrollment ID:</label>
    <input type="text" id="student-id">
    <button onclick="fetchStudentReport()">Get Student Report</button>

    <div id="report-container"></div>

    <script src="{{ url_for('static', path='admin2.js') }}"></script>
</body>
</html>
